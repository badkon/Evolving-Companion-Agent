[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolving-companion-agent"
version = "0.0.1"
description = "Engineering foundation for Evolving-Companion-Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "websockets>=15,<18",
    "textual>=8.2,<9",
    "starlette>=0.49,<2",
    "uvicorn>=0.35,<1",
    "Jinja2>=3.1.6,<4",
]

[project.scripts]
si = "evolving_companion.manager:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
local-memory = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["evolving_companion*"]
namespaces = false

[tool.setuptools.package-data]
evolving_companion = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
